<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>GiulliaBurra</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
  <style>
    body {
      background: linear-gradient(to right, #ffd1dc, #ffe6f0);
      font-family: 'Poppins', sans-serif;
      text-align: center;
      padding-top: 80px;
      overflow: hidden; /* Evita rolagem */
    }

    h1 {
      font-size: 64px;
      color: #ff66a3;
      margin-bottom: 20px;
      font-weight: 600;
      text-transform: uppercase;
      text-shadow: 3px 3px 6px rgba(255, 255, 255, 0.8), 2px 2px 2px rgba(0, 0, 0, 0.1);
      letter-spacing: 2px;
    }

    .love {
      font-size: 42px;
      font-weight: 600;
      animation: colorChange 1.5s infinite;
      text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.2);
      letter-spacing: 1.5px;
      color: #ff4d94;
    }

    @keyframes colorChange {
      0% { color: #ff4d94; }
      25% { color: #ff8cb3; }
      50% { color: #ff99cc; }
      75% { color: #ffa6e0; }
      100% { color: #ff4d94; }
    }

    .play-button {
      margin-top: 40px;
      background-color: #ff66a3;
      color: white;
      border: none;
      padding: 14px 28px;
      font-size: 18px;
      font-weight: 600;
      border-radius: 12px;
      cursor: pointer;
      text-transform: uppercase;
      transition: background 0.3s ease, transform 0.2s ease;
      box-shadow: 0px 4px 6px rgba(0, 0, 0, 0.1);
    }

    .play-button:hover {
      background-color: #e05590;
      transform: scale(1.05);
    }

    .play-button:active {
      transform: scale(0.95);
    }

    /* Estilo das palavras animadas */
    .word {
      position: absolute;
      font-size: 12px;
      font-weight: bold;
      color: #ff66a3;
      animation: fadeInOut 3s ease-in-out;
    }

    .word.big {
      font-size: 24px; /* Palavras como "Branca de neve" serão maiores */
      color: #ff4d94; /* Pode ter uma cor diferente */
    }

    @keyframes fadeInOut {
      0% { opacity: 0; }
      10% { opacity: 1; }
      90% { opacity: 1; }
      100% { opacity: 0; }
    }

    /* Estilo das estrelas */
    .star {
      position: absolute;
      width: 3px;
      height: 3px;
      background-color: white;
      border-radius: 50%;
      animation: float 5s linear infinite, twinkle 2s ease-in-out infinite;
    }

    @keyframes float {
      0% {
        transform: translateY(0);
      }
      100% {
        transform: translateY(100vh);
      }
    }

    @keyframes twinkle {
      0%, 100% { opacity: 0.8; }
      50% { opacity: 0.3; }
    }
  </style>
</head>
<body>
  <h1>GiulliaBurra</h1>
  <div class="love">Eu te amo</div>

  <button class="play-button" onclick="playMusic()">Tocar Música</button>

  <audio id="music" loop>
    <source src="BRUNOMARS.mp3" type="audio/mpeg">
    Seu navegador não suporta áudio.
  </audio>

  <script>
    function playMusic() {
      document.getElementById("music").play();
    }

    // Lista de palavras
    const words = [
      "Minha pretinha",
      "Preta",
      "Branca de neve",
      "Dengosa",
      "Minha safadinha",
      "Gorda",
      "Burra",
      "Idiota",
      "Minha Fortinha",
      "Gostosa",
      "Linda",
      "Minha princesa",
      "Amor da minha vida"
    ];

    // Função para criar palavras animadas
    function createWord() {
      const word = document.createElement('div');
      word.classList.add('word');

      // Escolhe uma palavra aleatória
      const randomWord = words[Math.floor(Math.random() * words.length)];
      word.textContent = randomWord;

      // Se a palavra for "Branca de neve", aplica a classe especial
      if (randomWord === "Branca de neve") {
        word.classList.add('big');
      }

      // Posição aleatória na tela
      word.style.left = Math.random() * 90 + 'vw'; // Horizontal
      word.style.top = Math.random() * 80 + 'vh'; // Vertical

      document.body.appendChild(word);

      // Remover palavra após a animação
      setTimeout(() => {
        word.remove();
      }, 3000); // 3 segundos
    }

    // Gerar palavras a cada 1 segundo
    setInterval(createWord, 1000);

    // Função para criar estrelas
    function createStar() {
      const star = document.createElement('div');
      star.classList.add('star');

      // Posição inicial aleatória
      star.style.left = Math.random() * 100 + 'vw';
      star.style.top = Math.random() * -20 + 'vh'; // Começa fora da tela

      // Duração aleatória
      star.style.animationDuration = Math.random() * 5 + 5 + 's';

      document.body.appendChild(star);

      // Remove estrela após a animação
      setTimeout(() => {
        star.remove();
      }, 10000);
    }

    // Gerar estrelas constantemente
    setInterval(createStar, 150);
  </script>
</body>
</html>
